<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Charmy · Acesso protegido</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(
          90deg,
          #fbf1fd 0 28px,
          #fffaff 28px 56px
        );
        font: 16px system-ui;
        color: #302633;
        padding: 24px;
      }
      main {
        background: white;
        border: 1px solid #eaddec;
        border-radius: 18px;
        padding: 40px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 16px 60px #53345012;
      }
      h1 {
        font: italic 48px Georgia;
        margin: 0 0 16px;
      }
      p {
        color: #78667c;
        line-height: 1.6;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #754477;
      }
      input,
      button {
        font: inherit;
        width: 100%;
        padding: 14px;
        border-radius: 8px;
        margin-top: 10px;
      }
      input {
        border: 1px solid #d9c5df;
      }
      button {
        border: 0;
        background: #754477;
        color: white;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      #message {
        font-size: 13px;
        min-height: 42px;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #eea8d8;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Charmy ✦</h1>
      <p>Digite a senha para abrir o planejamento.</p>
      <form>
        <label for="password">Senha</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        /><button>Desbloquear</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="unlock.js"></script>
  </body>
</html>
