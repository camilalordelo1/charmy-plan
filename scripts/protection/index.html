<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Charmy · Acesso protegido</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(
          90deg,
          #fbf1fd 0 28px,
          #fffaff 28px 56px
        );
        font: 16px system-ui;
        color: #302633;
        padding: 24px;
      }
      main {
        background: white;
        border: 1px solid #eaddec;
        border-radius: 18px;
        padding: 40px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 16px 60px #53345012;
      }
      h1 {
        font: italic 48px Georgia;
        margin: 0 0 16px;
      }
      p {
        color: #78667c;
        line-height: 1.6;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #754477;
      }
      input,
      button {
        font: inherit;
        width: 100%;
        padding: 14px;
        border-radius: 8px;
        margin-top: 10px;
      }
      input {
        border: 1px solid #d9c5df;
      }
      button {
        border: 0;
        background: #754477;
        color: white;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      .password-field { position: relative; margin-top: 10px; }
      .password-field input { margin-top: 0; padding-right: 52px; }
      #togglePassword { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); display: grid; place-items: center; background: transparent; color: #754477; width: 44px; height: 44px; padding: 10px; margin: 0; border-radius: 6px; }
      #togglePassword:hover { background: #f5eaf8; }
      #togglePassword svg { width: 22px; height: 22px; pointer-events: none; }
      #togglePassword .eye-slash { display: block; }
      #togglePassword[aria-pressed="true"] .eye-slash { display: none; }
      #message {
        font-size: 13px;
        min-height: 42px;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #eea8d8;
        outline-offset: 3px;
      }
      @media (max-width: 480px) {
        body { padding: 16px; }
        main { padding: 28px 22px; }
        h1 { font-size: 40px; }
        input { min-width: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Charmy ✦</h1>
      <p>Digite a senha para abrir o planejamento.</p>
      <form>
        <label for="password">Senha</label>
        <div class="password-field">
          <input id="password" type="password" autocomplete="current-password" required autofocus />
          <button type="button" id="togglePassword" aria-controls="password" aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
          </button>
        </div>
        <button type="submit">Desbloquear</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="unlock.js?v=eye-3"></script>
  </body>
</html>
